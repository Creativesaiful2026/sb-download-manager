name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o SB-Download-Manager-project.zip -x '.github/*'
          rm SB-Download-Manager-project.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Unpack project" || echo nothing
          git push
